[project]
name = "rns-shop"
version = "0.1.0"
description = "Self-hosted e-commerce over Reticulum/NomadNet: micron storefront + MeshAPI shop service, MeshData-native, Beacon-discoverable"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["rns>=0.7", "umsgpack", "pyyaml"]
# meshapi + meshdata: install from their repos (not yet on PyPI)

[tool.setuptools]
packages = ["rns_shop"]
